[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghwalk"
version = "0.1.0"
description = "A local LangGraph pipeline for golden hour walking loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "ollama>=0.3.0",
    "pydantic>=2.0",
    "osmnx>=1.9.0",
    "networkx>=3.0",
    "shapely>=2.0",
    "scipy>=1.10",
    "astral>=3.2",
    "matplotlib>=3.5",
    "jinja2>=3.0",
    "requests>=2.0",
    "psutil>=5.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "gradio>=4.0"
]

[project.scripts]
ghwalk = "ghwalk.__main__:main"
ghwalk-web = "ghwalk.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghwalk = ["templates/*.j2"]