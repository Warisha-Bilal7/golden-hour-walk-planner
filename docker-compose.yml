services:
  ghwalk-web:
    build: .
    container_name: ghwalk-web
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - HOST=0.0.0.0
      # Point to local host's Ollama instance if running on Docker Desktop / Linux
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./output:/app/output
      - ./data/cache:/app/data/cache
    restart: unless-stopped
